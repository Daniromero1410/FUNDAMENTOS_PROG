{% extends "base.html" %}

{% block banda %}
  <section class="banda">
    <div class="contenedor">
      <nav class="migas" aria-label="Ruta"><a href="/">Inicio</a> / <span>Profesores</span></nav>
      <h1>Profesores</h1>
      <p>Elige un profesor para ver sus tutorías de esta semana.</p>
    </div>
  </section>
{% endblock %}

{% block contenido %}
  <ul class="lista">
    {% for profesor in profesores %}
      <li>
        <a class="fila" href="/profesor/{{ profesor.id }}">
          <span class="fila-nombre">{{ profesor.nombre }}</span>
          <span class="fila-materia">{{ profesor.materia }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
